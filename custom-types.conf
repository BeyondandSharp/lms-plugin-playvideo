# PlayVideo content types for Lyrion Music Server.
#
# Format: <content type> <suffixes> <mime types> <server file type>
#
# The vid type covers all video container suffixes.  The suffix-less types
# are the audio codec specific content types PlayVideo uses for the audio
# track found in a video container:
#
#   vop opus, vaa AAC, vvo vorbis, vfl FLAC, vmp MP3,
#   vac AC-3, vae E-AC-3, vdt DTS, vth TrueHD
#
# Note: the mp4 suffix is intentionally mapped to vid.  The PlayVideo
# metadata reader detects audio-only MP4 files and remaps them to the
# regular mp4/alc content types, so music in MP4 containers stays audio.

vid     mp4,m4v,mov,qt,mkv,webm,avi,divx,xvid,mpg,mpeg,mpe,m2v,mp2v,ts,m2ts,mts,m2t,vob,ogv,3gp,3g2,3gp2,3gpp,flv,f4v,wmv,asf,rm,rmvb,mjpg,mjpeg     video/mp4,video/x-m4v,video/quicktime,video/x-matroska,video/webm,video/x-msvideo,video/mpeg,video/mp2t,video/x-flv,video/x-ms-wmv,video/x-ms-asf,video/x-realvideo,video/ogg,video/3gpp,video/x-mjpeg     audio

vop     -       audio/opus,audio/ogg;codecs=opus    audio
vaa     -       audio/aac,audio/aacp                 audio
vvo     -       audio/ogg,audio/vorbis               audio
vfl     -       audio/flac,audio/x-flac              audio
vmp     -       audio/mpeg,audio/mp3                 audio
vac     -       audio/ac3                            audio
vae     -       audio/eac3                           audio
vdt     -       audio/vnd.dts                        audio
vth     -       audio/truehd                         audio
